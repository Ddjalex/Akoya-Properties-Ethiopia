kind = "web"
previewPath = "/"
title = "Akoya Properties"
version = "1.0.0"
id = "artifacts/akoya-properties"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23788

[services.development]
run = "pnpm --filter @workspace/akoya-properties run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/akoya-properties", "run", "build" ]
publicDir = "artifacts/akoya-properties/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23788"
BASE_PATH = "/"
